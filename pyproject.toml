[project]
name = "rag-knowledge-base"
version = "0.1.0"
description = "多行业客服/陪伴知识库问答（RAG）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.0",
    "pytest>=8.0",
]

[project.optional-dependencies]
# Day 3 稀疏检索需要，先声明不强制安装
rag = [
    "rank-bm25>=0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
