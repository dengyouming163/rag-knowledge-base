[project]
name = "rag-knowledge-base"
version = "0.1.0"
description = "多行业客服/陪伴知识库问答（RAG）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pypdf>=4.0",
    "numpy>=1.26",
    "pydantic>=2.0",
    "pytest>=8.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
