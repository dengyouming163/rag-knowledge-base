[project]
name = "rag-knowledge-base"
version = "0.1.0"
description = "多行业客服/陪伴知识库问答（RAG）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "numpy>=1.26",
    "pydantic>=2.0",
    "pytest>=8.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "boto3>=1.34",
]

[project.optional-dependencies]
test = [
    "pdfplumber",
    "Pillow",
]
dev = ["ruff>=0.5", "pytest-cov>=5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "data", "eval/fixtures", "deploy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
# 脚本先改 sys.path 再导入项目模块，导入顺序是刻意的
"scripts/**" = ["E402"]
# 测试同样需要先注入 scripts/ 到 sys.path；test_trace 复用 test_api_search 的 fixture
"tests/**" = ["B011", "E402"]
"tests/test_trace.py" = ["B011", "E402", "F811"]
# FastAPI 依赖注入惯用法：File()/Depends() 只能作为参数默认值出现
"parser/main.py" = ["B008"]
