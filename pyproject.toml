[project]
name = "rag-knowledge-base"
version = "0.1.0"
description = "多行业客服/陪伴知识库问答（RAG）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
