name: Feature request
description: Propose a capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposal}
    validations: {required: true}
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: Not a security issue (see SECURITY.md)
          required: true
